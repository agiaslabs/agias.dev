<style>
  /* ロゴの字は JetBrains Mono のギリシャ部分だけを切り出したもの（OFL・/assets/fonts/JetBrainsMono-OFL.txt） */
  @font-face { font-family: 'AGIAS Greek'; font-style: normal; font-weight: 100 800; font-display: swap;
    src: url(/assets/fonts/jetbrains-mono-greek.woff2) format('woff2');
    unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  :root { color-scheme: dark; --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  html, body { margin: 0; height: 100%; background: #060910; }
  body { min-height: 100vh; }
  /* 画面の中央に固定する。body の高さの解釈（100% と 100dvh の差、モバイルの
     ツールバーの出入り）に左右されないよう、視点そのものの中央に置く。 */
  .center { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; width: max-content; max-width: 92vw; }
  .lock { display: flex; align-items: center; gap: 20px; }
  .mark { width: 38px; height: 38px; display: block; }
  .word { font-family: 'AGIAS Greek', var(--mono);
          font-size: 31px; font-weight: 500; letter-spacing: 0.22em; color: #FFFFFF;
          margin-right: -0.22em; }   /* 字送りの分だけ右に余白が出るので詰める */

  .ask { margin-top: 58px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em;
         color: rgba(95,211,243,0.72); text-align: center; }
  .row { margin-top: 22px; display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
  .sy-ai { display: flex; flex-direction: column; align-items: center; gap: 9px;
           text-decoration: none; color: rgba(221,230,239,0.52);
           transition: color .25s ease, transform .25s ease; }
  .sy-ai span { font-family: var(--mono); font-size: 8px; letter-spacing: 0.18em; }
  .sy-ai:hover, .sy-ai:focus-visible { color: #5FD3F3; transform: translateY(-2px); outline: none; }
  .sy-ai:focus-visible span { text-decoration: underline; }
  /* 流れから外す。空のときに場所を取ると、その分だけ全体が上へずれる。 */
  .note { position: absolute; top: 100%; left: 0; right: 0; margin-top: 24px; text-align: center;
          font-family: var(--mono); font-size: 9px;
          letter-spacing: 0.16em; color: rgba(95,211,243,0); transition: color .3s ease; }
  .note.on { color: rgba(95,211,243,0.8); }
  @media (max-width: 520px) {
    .mark { width: 30px; height: 30px; } .word { font-size: 24px; } .lock { gap: 15px; }
    .ask { margin-top: 44px; } .row { gap: 20px; }
  }
</style>
</head>

<script>
/* 押した AI に質問を渡す。q= を読まない先でも困らないよう、同じ文を控えにも入れる。 */
(function () {
  var note = document.getElementById('note');
  [].slice.call(document.querySelectorAll('.sy-ai')).forEach(function (a) {
    a.addEventListener('click', function () {
      // 見ている人の言語で質問を渡す
      var ja = (navigator.language || '').toLowerCase().indexOf('ja') === 0;
      var q = a.getAttribute(ja ? 'data-ask-ja' : 'data-ask-en');
      if (ja) {
        var h = a.getAttribute('href');
        if (h.indexOf('?q=') > -1 || h.indexOf('&q=') > -1)
          a.setAttribute('href', h.replace(/([?&]q=).*$/, '$1' + encodeURIComponent(q)));
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(q);
          note.textContent = 'QUESTION COPIED';
          note.className = 'note on';
          setTimeout(function () { note.className = 'note'; }, 2600);
        }
      } catch (e) {}
    });
  });
})();
</script>
