<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AGIAS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="text/plain" href="/llms.txt" title="Machine-readable summary">
<link rel="preload" href="/assets/fonts/jetbrains-mono-greek.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ロゴの字は JetBrains Mono のギリシャ部分だけを切り出したもの（OFL・/assets/fonts/JetBrainsMono-OFL.txt） */
  @font-face { font-family: 'AGIAS Greek'; font-style: normal; font-weight: 100 800; font-display: swap;
    src: url(/assets/fonts/jetbrains-mono-greek.woff2) format('woff2');
    unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  :root { color-scheme: dark; --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  html, body { margin: 0; height: 100%; background: #060910; }
  body { min-height: 100vh; }
  /* 画面の中央に固定する。body の高さの解釈（100% と 100dvh の差、モバイルの
     ツールバーの出入り）に左右されないよう、視点そのものの中央に置く。 */
  .center { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; max-width: 88vw; }
  .lock { display: flex; align-items: center; gap: 20px; }
  .mark { width: 38px; height: 38px; display: block; }
  .word { font-family: 'AGIAS Greek', var(--mono);
          font-size: 31px; font-weight: 500; letter-spacing: 0.22em; color: #FFFFFF;
          margin-right: -0.22em; }   /* 字送りの分だけ右に余白が出るので詰める */

         justify-content: center; justify-items: center; gap: 16px 26px; }
  @media (max-width: 520px) {
    .mark { width: 30px; height: 30px; } .word { font-size: 24px; } .lock { gap: 15px; }
  }
</style>
</head>
<body>
  <div class="center">
    <div class="lock" role="img" aria-label="AGIAS">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <clipPath id="mk"><rect x="0" y="0" width="32" height="27"/></clipPath>
        <g clip-path="url(#mk)">
          <path d="M3 31 L16 4 L29 31" fill="none" stroke="#DDE6EF" stroke-width="2.5"
                stroke-linejoin="miter" stroke-miterlimit="8" stroke-linecap="butt"/>
          <path d="M16 16 V31" fill="none" stroke="#DDE6EF" stroke-width="2.5" stroke-linecap="butt"/>
        </g>
      </svg>
      <span class="word" translate="no">&#913;&#915;&#921;&#913;&#931;</span>
    </div>

  </div>
</body>
</html>
