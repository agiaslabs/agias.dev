<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI に聞く — AGIAS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="text/plain" href="/llms.txt" title="Machine-readable summary">
<link rel="preload" href="/assets/fonts/jetbrains-mono-greek.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'AGIAS Greek'; font-style: normal; font-weight: 100 800; font-display: swap;
    src: url(/assets/fonts/jetbrains-mono-greek.woff2) format('woff2');
    unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  :root {
    --ground: #060910; --surface: #0B1119; --line: rgba(221,230,239,0.10);
    --line2: rgba(221,230,239,0.20); --text: #DDE6EF; --muted: rgba(221,230,239,0.58);
    --faint: rgba(221,230,239,0.36); --cyan: #5FD3F3;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--text); }
  body { font-family: var(--sans); font-weight: 300; font-size: 15px; line-height: 1.85;
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 22px 90px; }

  .top { display: flex; align-items: center; gap: 20px; padding: 26px 0 0; }
  .lock { display: flex; align-items: center; gap: 11px; text-decoration: none; }
  .lock svg { width: 19px; height: 19px; display: block; }
  .lock span { font-family: 'AGIAS Greek', var(--mono); font-size: 15px; font-weight: 500;
               letter-spacing: 0.2em; color: #FFF; margin-right: -0.2em; }
  #lang { margin-left: auto; background: none; border: 1px solid rgba(95,211,243,0.4);
          color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
          padding: 7px 12px; cursor: pointer; }
  #lang:hover, #lang:focus-visible { color: var(--cyan); border-color: var(--cyan); outline: none; }

  h1 { font-weight: 400; font-size: clamp(26px, 5.4vw, 36px); letter-spacing: -0.01em;
       line-height: 1.2; margin: 44px 0 0; text-wrap: balance; }
  .lede { margin: 14px 0 0; max-width: 58ch; color: var(--muted); font-size: 14px; }

  .search { margin-top: 30px; position: relative; }
  .search input { width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--line2); padding: 15px 16px 15px 42px;
    font-family: var(--sans); font-size: 15px; font-weight: 300; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; border-color: var(--cyan); }
  .search > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
                  width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .count { margin-top: 10px; font-family: var(--mono); font-size: 10px;
           letter-spacing: 0.18em; color: var(--faint); }

  .list { margin-top: 14px; border-top: 1px solid var(--line); }
  .card { border-bottom: 1px solid var(--line); }
  .card > button { width: 100%; display: block; text-align: left; background: none;
    border: 0; padding: 17px 34px 17px 0; cursor: pointer; color: inherit;
    font-family: inherit; position: relative; }
  .card > button:focus-visible { outline: 1px solid var(--cyan); outline-offset: -2px; }
  .card h2 { margin: 0; font-size: 16px; font-weight: 400; color: var(--text); line-height: 1.5; }
  .card p { margin: 5px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .card > button::after { content: '+'; position: absolute; right: 4px; top: 16px;
    font-family: var(--mono); font-size: 16px; color: var(--faint); }
  .card.open > button::after { content: '\2212'; color: var(--cyan); }
  .card.open h2 { color: var(--cyan); }

  .body { display: none; padding: 0 0 22px; }
  .card.open .body { display: block; }
  .body pre { margin: 0; background: var(--surface); border: 1px solid var(--line2);
    padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.85;
    white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .send { margin-top: 14px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .send a, .send button { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-decoration: none; border: 1px solid var(--line2); background: none;
    color: var(--muted); padding: 8px 12px; cursor: pointer; }
  .send a:hover, .send a:focus-visible, .send button:hover, .send button:focus-visible {
    color: var(--cyan); border-color: var(--cyan); outline: none; }
  .send .copy { border-color: var(--cyan); color: var(--cyan); }
  .send .copy.done { background: var(--cyan); color: var(--ground); }

  .empty { padding: 40px 0; color: var(--faint); font-family: var(--mono); font-size: 12px; }
  footer { margin-top: 52px; padding-top: 20px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10px; line-height: 2; color: var(--faint); }
  footer a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="lock" href="/" aria-label="AGIAS">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <clipPath id="mk"><rect x="0" y="0" width="32" height="27"/></clipPath>
        <g clip-path="url(#mk)">
          <path d="M3 31 L16 4 L29 31" fill="none" stroke="#DDE6EF" stroke-width="2.6"
                stroke-linejoin="miter" stroke-miterlimit="8"/>
          <path d="M16 16 V31" fill="none" stroke="#DDE6EF" stroke-width="2.6"/>
        </g>
      </svg>
      <span translate="no">&#913;&#915;&#921;&#913;&#931;</span>
    </a>
    <button id="lang" type="button" translate="no">EN</button>
  </div>

  <h1 id="h1">AI に聞く</h1>
  <p class="lede" id="lede">聞きたいことを選ぶと、そのまま使える質問文が出ます。押した AI が AGIAS の資料を読んで答えます。このページの利用に登録も費用もいりません。</p>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16 16"></path>
    </svg>
    <input id="q" type="search" autocomplete="off" placeholder="やりたいことを一言で。例：夜のうちに調べさせたい" aria-label="質問をさがす">
  </div>
  <div class="count" id="count"></div>

  <div class="list" id="list"></div>

  <footer>
    <span id="foot">これらの企業とは関係がありません。名称と商標は各社に帰属します。</span><br>
    <a href="/">AGIAS</a> &middot; <a href="/llms.txt">llms.txt</a>
  </footer>
</div>

<script>
/* 送り先。?q= で終わるものは、その形で質問を渡す。
   渡せない先でも、押した時点で同じ文を控えに入れるので貼るだけで済む。
   ⚠️ Mistral(Vibe) の ?q= は同社のページが実際に使っている形。他は未実測。 */
var TARGETS = [
  { n: 'CHATGPT',    u: 'https://chatgpt.com/?q=' },
  { n: 'PERPLEXITY', u: 'https://www.perplexity.ai/search?q=' },
  { n: 'CLAUDE',     u: 'https://claude.ai/new?q=' },
  { n: 'GEMINI',     u: 'https://gemini.google.com/app' },
  { n: 'COPILOT',    u: 'https://copilot.microsoft.com/?q=' },
  { n: 'GROK',       u: 'https://grok.com/?q=' },
  { n: 'VIBE',       u: 'https://chat.mistral.ai/chat?q=' },
  { n: 'META AI',    u: 'https://www.meta.ai/' }
];

var HEAD = {
  ja: 'あなたは、AI にくわしくない人にも分かるように話す案内役です。まず https://agias.dev/llms.txt を読んでください。',
  en: 'You are a guide who explains things to people who do not know much about AI. First read https://agias.dev/llms.txt.'
};
var TAIL = {
  ja: '条件：専門用語は使わず、どうしても要るときは一言で言いかえる。箇条書きは3つまで。',
  en: 'Rules: no jargon; if a term is unavoidable, gloss it in a few words. At most three bullets.'
};

var P = [
  { t:{ja:'まず、何を作ってもらえるのか',en:'What can they build for me'},
    s:{ja:'いちばん最初に読むもの。全体像を一枚で。',en:'Start here. The whole picture in one answer.'},
    k:'はじめて 全体 概要 できること overview start',
    b:{ja:'AGIAS に何を作ってもらえるのかを、3つに分けて説明してください。それぞれ「どんな人が、何のために使うか」を一文で添えてください。最後に、私に「どんな仕事で時間を取られていますか」と一つ質問してください。',
       en:'Explain what AGIAS can build, in three groups. For each, add one sentence on who uses it and why. Then ask me one question: what work is taking up my time?'}},

  { t:{ja:'自分の仕事に使えるか相談したい',en:'Would it fit my work'},
    s:{ja:'職種と困りごとを言えば、当てはまるかを一緒に考えてくれます。',en:'Say your trade and your problem; work out together whether it fits.'},
    k:'相談 自分 仕事 業種 fit consult',
    b:{ja:'私の仕事に AGIAS の作るものが役に立つかを一緒に考えてください。まず私に、職種・毎日くり返している作業・いちばん時間を取られていることの3つを聞いてください。答えたら、当てはまるものと当てはまらないものを正直に分けて教えてください。',
       en:'Help me work out whether what AGIAS builds would help me. First ask me three things: my trade, the task I repeat every day, and what takes the most time. Then tell me honestly what fits and what does not.'}},

  { t:{ja:'依頼するとどう進むのか',en:'How a request runs'},
    s:{ja:'送ってから受け取るまでの順番と、お金が動く場所。',en:'The order of steps, and where money enters.'},
    k:'依頼 流れ 手順 見積り 費用 process quote cost',
    b:{ja:'AGIAS に依頼したとき、送ってから受け取るまでに何が起きるかを順番に説明してください。お金が発生するのがどこかも、はっきり書いてください。最後に、私に「最初に送る一言は何にしますか」と質問してください。',
       en:'Explain, in order, what happens from sending a request to receiving the result. Say clearly at which point money is involved. Then ask me what my first message would say.'}},

  { t:{ja:'夜のうちに調べさせたい',en:'Have it research overnight'},
    s:{ja:'毎晩ひとりでに調べて、朝に理由つきで並べる機械の話。',en:'A machine that reads your field at night and reports with reasons.'},
    k:'調査 夜間 研究 情報収集 research nightly',
    b:{ja:'毎晩ひとりでに調べて朝に報告する機械について説明してください。何を渡せばよくて、朝に何が返ってくるのかを具体的に。私の分野を聞いてから、その分野なら何を見張ることになるかの例を3つ挙げてください。',
       en:'Explain the machine that reads a field every night and reports in the morning. Say concretely what I hand over and what comes back. Ask my field, then give three examples of what it would watch.'}},

  { t:{ja:'作り続ける機械がほしい',en:'A machine that keeps making'},
    s:{ja:'画像・映像・文章・データを、決めた周期で作り続ける側。',en:'Images, motion, text and data, made on a schedule you set.'},
    k:'生成 画像 映像 制作 自動 generative images',
    b:{ja:'決めた周期でひとりでに作り続ける機械について説明してください。何を渡せばよくて、どんな形で受け取れるのかを具体的に。私が何を作りたいのかを聞いてから、その場合にどうなるかを一つ例で示してください。',
       en:'Explain the machine that keeps generating on a schedule. Say what I hand over and in what form the result arrives. Ask what I want to make, then show one worked example.'}},

  { t:{ja:'くり返しの手作業を渡したい',en:'Hand over the repetitive work'},
    s:{ja:'記録・受付・定型の作業を、寝ている間に回す側。',en:'Records, intake and routine work, running while you sleep.'},
    k:'自動化 事務 定型 受付 運用 operations automate',
    b:{ja:'くり返しの手作業を機械に渡す話を説明してください。渡せる作業と、渡さないほうがいい作業を分けて教えてください。私に、いま手でやっている作業を一つ聞いてから、それが渡せるかを答えてください。',
       en:'Explain handing repetitive work to a machine. Separate what can be handed over from what should not be. Ask me for one task I do by hand, then say whether it can be handed over.'}},

  { t:{ja:'AI に任せて大丈夫なのか',en:'Is it safe to let AI do this'},
    s:{ja:'止める仕組み・承認・記録が、どこにどう入っているか。',en:'Where the stops, the approvals and the record actually sit.'},
    k:'安全 制御 承認 記録 暴走 safety control approval',
    b:{ja:'AI が勝手に進んでしまわないように、AGIAS の作るものにどんな歯止めが入っているかを説明してください。人が決める場所と、記録が残る場所を具体的に。最後に、私がいちばん不安に思っていることを一つ聞いてください。',
       en:'Explain what stops the AI from acting on its own in what AGIAS builds. Be concrete about where a human decides and where a record is kept. Then ask what worries me most.'}},

  { t:{ja:'送った資料はどう扱われるのか',en:'What happens to what I send'},
    s:{ja:'預けた材料の行き先と、残る期間。',en:'Where the material goes, and how long it stays.'},
    k:'プライバシー 個人情報 データ 秘密 privacy data',
    b:{ja:'AGIAS に資料を送ったとき、それがどこへ行き、どれくらい残るのかを説明してください。分からない点があれば「ここは書かれていない」とはっきり言ってください。最後に、私が確認しておくべきことを一つ挙げてください。',
       en:'Explain where material I send goes and how long it is kept. If something is not stated, say plainly that it is not stated. Then name one thing I should confirm.'}},

  { t:{ja:'いちばん小さく試すには',en:'The smallest way to try'},
    s:{ja:'いきなり大きく作らない場合の、最初の一歩。',en:'A first step that is not a whole system.'},
    k:'小さく 試す 最初 お試し 一歩 small trial start',
    b:{ja:'いきなり大きなものを作らずに、いちばん小さく試すとしたら何から始めるのがいいかを提案してください。私の状況を聞いてから、1週間で確かめられる範囲の案を一つに絞って示してください。',
       en:'Suggest the smallest way to try this instead of building something big. Ask about my situation, then narrow it to one thing I could test within a week.'}},

  { t:{ja:'制作会社に頼むのと何が違うのか',en:'How is this different from an agency'},
    s:{ja:'向いている場面と、向いていない場面。',en:'Where it fits, and where it does not.'},
    k:'比較 違い 制作会社 外注 difference agency',
    b:{ja:'AGIAS に頼むのと、制作会社やフリーランスに頼むのとの違いを説明してください。AGIAS が向かない場面も正直に挙げてください。最後に、私がいま考えている依頼の中身を一つ聞いてください。',
       en:'Explain how asking AGIAS differs from asking an agency or a freelancer. Include, honestly, where AGIAS is not the right choice. Then ask what I am thinking of asking for.'}},

  { t:{ja:'技術の中身を知りたい',en:'What it is built on'},
    s:{ja:'くわしい人向け。動かし方と作りの話。',en:'For readers who already know the field.'},
    k:'技術 仕組み 上級 実装 構成 technical stack',
    b:{ja:'私は技術者です。AGIAS がどういう作りで、AI をどう制御しているのかを、専門用語を使って説明してください。門・手順・回路にあたるものが具体的に何を指すのかも。最後に、実装として弱いと思う点を一つ挙げてください。',
       en:'I work in software. Explain how AGIAS is built and how it keeps the AI under control, using proper terms. Say concretely what the gates, procedures and loops are. Then name one point you consider weak.'}},

  { t:{ja:'頼む前に用意しておくもの',en:'What to prepare first'},
    s:{ja:'手ぶらで相談してもいいのか。あると早いもの。',en:'Can I come empty-handed, and what speeds things up.'},
    k:'準備 用意 材料 事前 prepare before',
    b:{ja:'AGIAS に相談する前に用意しておくと早いものを教えてください。何も用意がなくても相談していいのかも、はっきり答えてください。最後に、私がいま持っている材料を一つ聞いてください。',
       en:'Tell me what is worth preparing before contacting AGIAS, and say plainly whether it is fine to come with nothing. Then ask what material I already have.'}}
];

var UI = {
  ja: { h1:'AI に聞く', lang:'EN',
        lede:'聞きたいことを選ぶと、そのまま使える質問文が出ます。押した AI が AGIAS の資料を読んで答えます。このページの利用に登録も費用もいりません。',
        ph:'やりたいことを一言で。例：夜のうちに調べさせたい',
        count:function(n){ return n + ' 件の質問'; }, empty:'見つかりません。ことばを変えてみてください。',
        copy:'控えにコピー', done:'コピーしました',
        foot:'これらの企業とは関係がありません。名称と商標は各社に帰属します。' },
  en: { h1:'Ask an AI', lang:'JP',
        lede:'Pick what you want to know and get a question you can send as it is. The AI you press reads what AGIAS publishes and answers. Using this page costs nothing and needs no account.',
        ph:'Say it in a few words. e.g. research overnight',
        count:function(n){ return n + ' questions'; }, empty:'Nothing matched. Try other words.',
        copy:'COPY', done:'COPIED',
        foot:'Not affiliated with these companies. Names and marks belong to their owners.' }
};

var lang = (navigator.language || 'en').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
var list = document.getElementById('list');
var qbox = document.getElementById('q');

function text(p) { return HEAD[lang] + '\n\n' + p.b[lang] + '\n\n' + TAIL[lang]; }

function render() {
  var u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById('h1').textContent = u.h1;
  document.getElementById('lede').textContent = u.lede;
  document.getElementById('lang').textContent = u.lang;
  document.getElementById('foot').textContent = u.foot;
  qbox.placeholder = u.ph;

  var term = qbox.value.trim().toLowerCase();
  var hits = P.filter(function (p) {
    if (!term) return true;
    return (p.t.ja + p.t.en + p.s.ja + p.s.en + p.k + p.b.ja + p.b.en).toLowerCase().indexOf(term) > -1;
  });
  document.getElementById('count').textContent = u.count(hits.length);
  list.innerHTML = '';
  if (!hits.length) { list.innerHTML = '<div class="empty">' + u.empty + '</div>'; return; }

  hits.forEach(function (p) {
    var card = document.createElement('div'); card.className = 'card';
    var head = document.createElement('button'); head.type = 'button';
    var h2 = document.createElement('h2'); h2.textContent = p.t[lang];
    var sub = document.createElement('p'); sub.textContent = p.s[lang];
    head.appendChild(h2); head.appendChild(sub);
    head.addEventListener('click', function () { card.classList.toggle('open'); });

    var body = document.createElement('div'); body.className = 'body';
    var pre = document.createElement('pre'); pre.textContent = text(p);
    var send = document.createElement('div'); send.className = 'send';

    var copy = document.createElement('button');
    copy.type = 'button'; copy.className = 'copy'; copy.textContent = u.copy;
    copy.addEventListener('click', function () {
      navigator.clipboard.writeText(text(p)).then(function () {
        copy.textContent = u.done; copy.classList.add('done');
        setTimeout(function () { copy.textContent = u.copy; copy.classList.remove('done'); }, 2000);
      });
    });
    send.appendChild(copy);

    TARGETS.forEach(function (t) {
      var a = document.createElement('a');
      a.href = t.u.slice(-1) === '=' ? t.u + encodeURIComponent(text(p)) : t.u;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.setAttribute('translate', 'no'); a.textContent = t.n;
      a.addEventListener('click', function () {
        try { navigator.clipboard.writeText(text(p)); } catch (e) {}
      });
      send.appendChild(a);
    });

    body.appendChild(pre); body.appendChild(send);
    card.appendChild(head); card.appendChild(body);
    list.appendChild(card);
  });
}

qbox.addEventListener('input', render);
document.getElementById('lang').addEventListener('click', function () {
  lang = lang === 'ja' ? 'en' : 'ja'; render();
});
render();
</script>
</body>
</html>
